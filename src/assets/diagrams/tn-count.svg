<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="tn-count-title tn-count-desc" style="display:block;width:100%;min-width:820px;max-width:820px;height:auto;margin-inline:auto">
<title id="tn-count-title">Luồng kiểm kê kho</title>
<desc id="tn-count-desc">Thủ kho đếm dần từng dòng hàng trên phiếu nháp qua nhiều phiên, rồi ghi sổ; chênh lệch được tính theo tồn thật tại lúc ghi sổ chứ không theo lúc đếm.</desc>
<style>
.fd-bg{fill:var(--bg-soft,#f6f7f6)}
.fd-dot{fill:var(--border,#e6e9e6)}
.fd-node{fill:var(--surface,#fff);stroke:var(--ink,#121815);stroke-width:1}
.fd-end{fill:var(--bg-soft,#f6f7f6);stroke:var(--ink-faint,#838d86);stroke-width:1}
.fd-focal{fill:var(--accent-tint,#e6f3ee);stroke:var(--accent,#0b7a5b);stroke-width:1.2}
.fd-name{font:600 13px/1 var(--sans,system-ui,sans-serif);fill:var(--ink,#121815)}
.fd-sub{font:400 11px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-lbl{font:600 10px/1 var(--sans,system-ui,sans-serif);letter-spacing:.08em;fill:var(--ink-secondary,#4b544e)}
.fd-lbl-a{fill:var(--accent,#0b7a5b)}
.fd-note{font:italic 400 12px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-eyebrow{font:600 9px/1 var(--sans,system-ui,sans-serif);letter-spacing:.16em;fill:var(--ink-faint,#838d86)}
.fd-arrow{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
.fd-arrow-a{fill:none;stroke:var(--accent,#0b7a5b);stroke-width:1.5}
.fd-dash{stroke-dasharray:3 3;stroke:var(--ink-faint,#838d86)}
.fd-ah{fill:var(--ink-secondary,#4b544e)}
.fd-ah-a{fill:var(--accent,#0b7a5b)}
.fd-mask{fill:var(--bg-soft,#f6f7f6)}
.fd-rule{stroke:var(--border,#e6e9e6);stroke-width:1}
.fd-dashed{stroke-dasharray:4 3}
.fd-line{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
</style>
<defs>
<pattern id="tn-count-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" class="fd-dot"/></pattern>
<marker id="tn-count-ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah" points="0 0, 8 3, 0 6"/></marker>
<marker id="tn-count-ah-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah-a" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="fd-bg" width="820" height="480"/>
<rect width="820" height="480" fill="url(#tn-count-dots)" opacity="0.6"/>
<!-- connectors (behind nodes) -->
<path class="fd-arrow" d="M188,156 L232,156" marker-end="url(#tn-count-ah)"/>
<path class="fd-arrow" d="M380,156 L424,156" marker-end="url(#tn-count-ah)"/>
<path class="fd-arrow" d="M498,124 L498,84 Q498,76 490,76 L314,76 Q306,76 306,84 L306,124" marker-end="url(#tn-count-ah)"/>
<path class="fd-arrow" d="M572,156 L632,156" marker-end="url(#tn-count-ah)"/>
<path class="fd-arrow" d="M706,188 L706,264" marker-end="url(#tn-count-ah)"/>
<path class="fd-arrow" d="M632,296 L556,296" marker-end="url(#tn-count-ah)"/>
<path class="fd-arrow" d="M276,188 L276,268" marker-end="url(#tn-count-ah)"/>
<!-- arrow labels -->
<rect class="fd-mask" x="368" y="68" width="68" height="16" rx="2"/><text class="fd-lbl" x="402" y="79.5" text-anchor="middle">ĐẾM TIẾP</text>
<rect class="fd-mask" x="574" y="288" width="40" height="16" rx="2"/><text class="fd-lbl" x="594" y="299.5" text-anchor="middle">CHỐT</text>
<rect class="fd-mask" x="286" y="220" width="75" height="16" rx="2"/><text class="fd-lbl" x="323.5" y="231.5" text-anchor="middle">HUỶ PHIẾU</text>
<!-- nodes -->
<rect class="fd-end" x="40" y="128" width="148" height="56" rx="28"/><text class="fd-name" x="114.0" y="153" text-anchor="middle">Tạo phiếu</text><text class="fd-sub" x="114.0" y="169" text-anchor="middle">chọn kho</text>
<rect class="fd-node" x="232" y="124" width="148" height="64" rx="6"/><text class="fd-name" x="306.0" y="145" text-anchor="middle">Chưa đếm</text><text class="fd-sub" x="306.0" y="161" text-anchor="middle">tìm trong danh sách</text><text class="fd-sub" x="306.0" y="175" text-anchor="middle">bấm + Đếm</text>
<rect class="fd-node" x="424" y="124" width="148" height="64" rx="6"/><text class="fd-name" x="498.0" y="145" text-anchor="middle">Đã đếm</text><text class="fd-sub" x="498.0" y="161" text-anchor="middle">số lượng đếm được</text><text class="fd-sub" x="498.0" y="175" text-anchor="middle">tồn hệ thống · chênh lệch</text>
<rect class="fd-node" x="632" y="124" width="148" height="64" rx="6"/><text class="fd-name" x="706.0" y="153" text-anchor="middle">Bấm Ghi sổ</text><text class="fd-sub" x="706.0" y="169" text-anchor="middle">cần ≥ 1 dòng đã đếm</text>
<rect class="fd-node" x="632" y="264" width="148" height="64" rx="6"/><text class="fd-name" x="706.0" y="285" text-anchor="middle">Xác nhận ghi sổ</text><text class="fd-sub" x="706.0" y="301" text-anchor="middle">chênh lệch tính theo</text><text class="fd-sub" x="706.0" y="315" text-anchor="middle">tồn thật lúc chốt</text>
<rect class="fd-focal" x="372" y="264" width="184" height="64" rx="6"/><text class="fd-name" x="464.0" y="285" text-anchor="middle">Đã ghi sổ</text><text class="fd-sub" x="464.0" y="301" text-anchor="middle">dòng lệch: tạo điều chỉnh tồn</text><text class="fd-sub" x="464.0" y="315" text-anchor="middle">dòng khớp: không đổi</text>
<rect class="fd-end" x="216" y="268" width="120" height="56" rx="28"/><text class="fd-name" x="276.0" y="293" text-anchor="middle">Huỷ phiếu</text><text class="fd-sub" x="276.0" y="309" text-anchor="middle">xoá hẳn phiếu</text>
<!-- legend / notes -->
<text class="fd-note" x="40" y="372" text-anchor="start">Có thể đếm rải rác nhiều ngày,</text><text class="fd-note" x="40" y="388" text-anchor="start">không cần đóng kho.</text>
<line class="fd-rule" x1="40" y1="430" x2="780" y2="430"/>
<text class="fd-eyebrow" x="40" y="450">CHÚ GIẢI</text>
<rect class="fd-end" x="116" y="440" width="24" height="12" rx="6"/>
<text class="fd-sub" x="148" y="450">Bắt đầu / kết thúc</text>
<rect class="fd-node" x="276" y="440" width="24" height="12" rx="2"/>
<text class="fd-sub" x="308" y="450">Bước</text>
<rect class="fd-focal" x="358" y="440" width="24" height="12" rx="2"/>
<text class="fd-sub" x="390" y="450">Bước điều chỉnh tồn</text>
<path class="fd-arrow" d="M518,446 L542,446" marker-end="url(#tn-count-ah)"/>
<text class="fd-sub" x="550" y="450">Chuyển bước</text>
</svg>
