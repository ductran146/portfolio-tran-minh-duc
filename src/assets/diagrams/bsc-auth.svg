<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" role="img" aria-labelledby="bsc-auth-title bsc-auth-desc" style="display:block;width:100%;min-width:820px;max-width:820px;height:auto;margin-inline:auto">
<title id="bsc-auth-title">Luồng đăng nhập khi chưa đăng nhập hoặc hết phiên</title>
<desc id="bsc-auth-desc">Khi người dùng mở chức năng cần đăng nhập, hệ thống kiểm tra trạng thái; nếu chưa đăng nhập hoặc hết phiên thì hiện form hoặc thông báo đăng nhập, sau đó đưa về chức năng đang dùng.</desc>
<style>
.fd-bg{fill:var(--bg-soft,#f6f7f6)}
.fd-dot{fill:var(--border,#e6e9e6)}
.fd-node{fill:var(--surface,#fff);stroke:var(--ink,#121815);stroke-width:1}
.fd-end{fill:var(--bg-soft,#f6f7f6);stroke:var(--ink-faint,#838d86);stroke-width:1}
.fd-focal{fill:var(--accent-tint,#e6f3ee);stroke:var(--accent,#0b7a5b);stroke-width:1.2}
.fd-name{font:600 13px/1 var(--sans,system-ui,sans-serif);fill:var(--ink,#121815)}
.fd-sub{font:400 11px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-lbl{font:600 10px/1 var(--sans,system-ui,sans-serif);letter-spacing:.08em;fill:var(--ink-secondary,#4b544e)}
.fd-lbl-a{fill:var(--accent,#0b7a5b)}
.fd-note{font:italic 400 12px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-eyebrow{font:600 9px/1 var(--sans,system-ui,sans-serif);letter-spacing:.16em;fill:var(--ink-faint,#838d86)}
.fd-arrow{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
.fd-arrow-a{fill:none;stroke:var(--accent,#0b7a5b);stroke-width:1.5}
.fd-dash{stroke-dasharray:3 3;stroke:var(--ink-faint,#838d86)}
.fd-ah{fill:var(--ink-secondary,#4b544e)}
.fd-ah-a{fill:var(--accent,#0b7a5b)}
.fd-mask{fill:var(--bg-soft,#f6f7f6)}
.fd-rule{stroke:var(--border,#e6e9e6);stroke-width:1}
.fd-dashed{stroke-dasharray:4 3}
.fd-line{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
</style>
<defs>
<pattern id="bsc-auth-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" class="fd-dot"/></pattern>
<marker id="bsc-auth-ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah" points="0 0, 8 3, 0 6"/></marker>
<marker id="bsc-auth-ah-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah-a" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="fd-bg" width="820" height="540"/>
<rect width="820" height="540" fill="url(#bsc-auth-dots)" opacity="0.6"/>
<!-- connectors (behind nodes) -->
<path class="fd-arrow" d="M152,140 L196,140" marker-end="url(#bsc-auth-ah)"/>
<path class="fd-arrow" d="M316,140 L400,140" marker-end="url(#bsc-auth-ah)"/>
<path class="fd-arrow" d="M256,188 L256,292 Q256,300 264,300 L400,300" marker-end="url(#bsc-auth-ah)"/>
<path class="fd-arrow" d="M460,268 L460,172" marker-end="url(#bsc-auth-ah)"/>
<path class="fd-arrow" d="M460,332 L460,392" marker-end="url(#bsc-auth-ah)"/>
<path class="fd-arrow" d="M710,172 L710,268" marker-end="url(#bsc-auth-ah)"/>
<path class="fd-arrow" d="M640,300 L520,300" marker-end="url(#bsc-auth-ah)"/>
<path class="fd-arrow" d="M710,332 L710,392" marker-end="url(#bsc-auth-ah)"/>
<!-- arrow labels -->
<rect class="fd-mask" x="345" y="132" width="26" height="16" rx="2"/><text class="fd-lbl" x="358" y="143.5" text-anchor="middle">CÓ</text>
<rect class="fd-mask" x="308" y="292" width="40" height="16" rx="2"/><text class="fd-lbl" x="328" y="303.5" text-anchor="middle">CHƯA</text>
<rect class="fd-mask" x="470" y="212" width="75" height="16" rx="2"/><text class="fd-lbl" x="507.5" y="223.5" text-anchor="middle">ĐĂNG NHẬP</text>
<rect class="fd-mask" x="470" y="354" width="61" height="16" rx="2"/><text class="fd-lbl" x="500.5" y="365.5" text-anchor="middle">ĐĂNG KÝ</text>
<rect class="fd-mask" x="542.5" y="292" width="75" height="16" rx="2"/><text class="fd-lbl" x="580" y="303.5" text-anchor="middle">ĐĂNG NHẬP</text>
<rect class="fd-mask" x="720" y="354" width="54" height="16" rx="2"/><text class="fd-lbl" x="747" y="365.5" text-anchor="middle">ĐỂ SAU</text>
<!-- nodes -->
<rect class="fd-end" x="40" y="108" width="112" height="64" rx="32"/><text class="fd-name" x="96.0" y="137" text-anchor="middle">Mở chức năng</text><text class="fd-sub" x="96.0" y="153" text-anchor="middle">cần đăng nhập</text>
<polygon class="fd-node" points="256,92 316,140 256,188 196,140"/><text class="fd-name" x="256" y="144.5" text-anchor="middle" style="font-size:12px">Đã đăng nhập?</text>
<rect class="fd-focal" x="400" y="108" width="120" height="64" rx="6"/><text class="fd-name" x="460.0" y="129" text-anchor="middle">Dùng chức năng</text><text class="fd-sub" x="460.0" y="145" text-anchor="middle">đặt lệnh, xem mã</text><text class="fd-sub" x="460.0" y="159" text-anchor="middle">xem danh mục</text>
<rect class="fd-node" x="400" y="268" width="120" height="64" rx="6"/><text class="fd-name" x="460.0" y="297" text-anchor="middle">Form đăng nhập</text><text class="fd-sub" x="460.0" y="313" text-anchor="middle">Đăng ký · Đăng nhập</text>
<rect class="fd-end fd-dashed" x="380" y="392" width="160" height="56" rx="28"/><text class="fd-name" x="460.0" y="417" text-anchor="middle">Đăng ký tài khoản</text><text class="fd-sub" x="460.0" y="433" text-anchor="middle">luồng riêng</text>
<rect class="fd-end" x="640" y="108" width="140" height="64" rx="32"/><text class="fd-name" x="710.0" y="137" text-anchor="middle">Đang giao dịch</text><text class="fd-sub" x="710.0" y="153" text-anchor="middle">phiên hết hạn</text>
<rect class="fd-node" x="640" y="268" width="140" height="64" rx="6"/><text class="fd-name" x="710.0" y="297" text-anchor="middle">Thông báo hết phiên</text><text class="fd-sub" x="710.0" y="313" text-anchor="middle">Đăng nhập · Để sau</text>
<rect class="fd-end" x="620" y="392" width="180" height="56" rx="28"/><text class="fd-name" x="710.0" y="417" text-anchor="middle">Đóng thông báo</text><text class="fd-sub" x="710.0" y="433" text-anchor="middle">quay lại màn hiện tại</text>
<!-- legend / notes -->
<line class="fd-rule" x1="40" y1="488" x2="780" y2="488"/>
<text class="fd-eyebrow" x="40" y="508">CHÚ GIẢI</text>
<rect class="fd-end" x="116" y="498" width="24" height="12" rx="6"/>
<text class="fd-sub" x="148" y="508">Bắt đầu / kết thúc</text>
<rect class="fd-node" x="276" y="498" width="24" height="12" rx="2"/>
<text class="fd-sub" x="308" y="508">Bước</text>
<rect class="fd-focal" x="358" y="498" width="24" height="12" rx="2"/>
<text class="fd-sub" x="390" y="508">Nơi người dùng muốn tới</text>
<polygon class="fd-node" points="546,504 558,497 570,504 558,511"/>
<text class="fd-sub" x="578" y="508">Điều kiện</text>
<path class="fd-arrow" d="M654,504 L678,504" marker-end="url(#bsc-auth-ah)"/>
<text class="fd-sub" x="686" y="508">Chuyển bước</text>
</svg>
