<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="bsc-orderbook-title bsc-orderbook-desc" style="display:block;width:100%;min-width:1000px;max-width:1000px;height:auto;margin-inline:auto">
<title id="bsc-orderbook-title">Luồng quản lý lệnh trong Sổ lệnh</title>
<desc id="bsc-orderbook-desc">Từ Sổ lệnh, người dùng mở chi tiết lệnh rồi chọn huỷ hoặc sửa; sửa lệnh có cảnh báo và chỉ cho đổi giá hoặc khối lượng, cả hai nhánh đều qua xác nhận và xác thực.</desc>
<style>
.fd-bg{fill:var(--bg-soft,#f6f7f6)}
.fd-dot{fill:var(--border,#e6e9e6)}
.fd-node{fill:var(--surface,#fff);stroke:var(--ink,#121815);stroke-width:1}
.fd-end{fill:var(--bg-soft,#f6f7f6);stroke:var(--ink-faint,#838d86);stroke-width:1}
.fd-focal{fill:var(--accent-tint,#e6f3ee);stroke:var(--accent,#0b7a5b);stroke-width:1.2}
.fd-name{font:600 13px/1 var(--sans,system-ui,sans-serif);fill:var(--ink,#121815)}
.fd-sub{font:400 11px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-lbl{font:600 10px/1 var(--sans,system-ui,sans-serif);letter-spacing:.08em;fill:var(--ink-secondary,#4b544e)}
.fd-lbl-a{fill:var(--accent,#0b7a5b)}
.fd-note{font:italic 400 12px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-eyebrow{font:600 9px/1 var(--sans,system-ui,sans-serif);letter-spacing:.16em;fill:var(--ink-faint,#838d86)}
.fd-arrow{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
.fd-arrow-a{fill:none;stroke:var(--accent,#0b7a5b);stroke-width:1.5}
.fd-dash{stroke-dasharray:3 3;stroke:var(--ink-faint,#838d86)}
.fd-ah{fill:var(--ink-secondary,#4b544e)}
.fd-ah-a{fill:var(--accent,#0b7a5b)}
.fd-mask{fill:var(--bg-soft,#f6f7f6)}
.fd-rule{stroke:var(--border,#e6e9e6);stroke-width:1}
.fd-dashed{stroke-dasharray:4 3}
.fd-line{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
</style>
<defs>
<pattern id="bsc-orderbook-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" class="fd-dot"/></pattern>
<marker id="bsc-orderbook-ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah" points="0 0, 8 3, 0 6"/></marker>
<marker id="bsc-orderbook-ah-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah-a" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="fd-bg" width="1000" height="540"/>
<rect width="1000" height="540" fill="url(#bsc-orderbook-dots)" opacity="0.6"/>
<!-- connectors (behind nodes) -->
<path class="fd-arrow" d="M160,228 L200,228" marker-end="url(#bsc-orderbook-ah)"/>
<path class="fd-arrow" d="M320,228 L360,228" marker-end="url(#bsc-orderbook-ah)"/>
<path class="fd-arrow" d="M100,260 L100,340" marker-end="url(#bsc-orderbook-ah)"/>
<path class="fd-arrow" d="M420,180 L420,108 Q420,100 428,100 L520,100" marker-end="url(#bsc-orderbook-ah)"/>
<path class="fd-arrow" d="M420,276 L420,364 Q420,372 428,372 L520,372" marker-end="url(#bsc-orderbook-ah)"/>
<path class="fd-arrow" d="M640,372 L680,372" marker-end="url(#bsc-orderbook-ah)"/>
<path class="fd-arrow" d="M800,372 L840,372" marker-end="url(#bsc-orderbook-ah)"/>
<path class="fd-arrow" d="M640,100 L892,100 Q900,100 900,108 L900,200" marker-end="url(#bsc-orderbook-ah)"/>
<path class="fd-arrow" d="M900,340 L900,256" marker-end="url(#bsc-orderbook-ah)"/>
<line class="fd-line" x1="740" y1="404" x2="740" y2="426"/>
<!-- arrow labels -->
<rect class="fd-mask" x="110" y="292" width="89" height="16" rx="2"/><text class="fd-lbl" x="154.5" y="303.5" text-anchor="middle">XEM LỊCH SỬ</text>
<rect class="fd-mask" x="455.5" y="92" width="33" height="16" rx="2"/><text class="fd-lbl" x="472" y="103.5" text-anchor="middle">HUỶ</text>
<rect class="fd-mask" x="455.5" y="364" width="33" height="16" rx="2"/><text class="fd-lbl" x="472" y="375.5" text-anchor="middle">SỬA</text>
<rect class="fd-mask" x="736" y="92" width="68" height="16" rx="2"/><text class="fd-lbl" x="770" y="103.5" text-anchor="middle">XÁC NHẬN</text>
<!-- nodes -->
<rect class="fd-node" x="40" y="196" width="120" height="64" rx="6"/><text class="fd-name" x="100.0" y="217" text-anchor="middle">Sổ lệnh</text><text class="fd-sub" x="100.0" y="233" text-anchor="middle">lệnh trong ngày</text><text class="fd-sub" x="100.0" y="247" text-anchor="middle">lọc theo trạng thái</text>
<rect class="fd-node" x="200" y="196" width="120" height="64" rx="6"/><text class="fd-name" x="260.0" y="217" text-anchor="middle">Chi tiết lệnh</text><text class="fd-sub" x="260.0" y="233" text-anchor="middle">thông tin lệnh</text><text class="fd-sub" x="260.0" y="247" text-anchor="middle">nút Huỷ · Sửa</text>
<polygon class="fd-node" points="420,180 480,228 420,276 360,228"/><text class="fd-name" x="420" y="225.5" text-anchor="middle" style="font-size:12px">Huỷ hay</text><text class="fd-name" x="420" y="240.5" text-anchor="middle" style="font-size:12px">sửa lệnh?</text>
<rect class="fd-node" x="520" y="68" width="120" height="64" rx="6"/><text class="fd-name" x="580.0" y="89" text-anchor="middle">Xác nhận huỷ</text><text class="fd-sub" x="580.0" y="105" text-anchor="middle">tóm tắt lệnh</text><text class="fd-sub" x="580.0" y="119" text-anchor="middle">kèm xác thực</text>
<rect class="fd-node" x="520" y="340" width="120" height="64" rx="6"/><text class="fd-name" x="580.0" y="361" text-anchor="middle">Lưu ý khi sửa</text><text class="fd-sub" x="580.0" y="377" text-anchor="middle">quy tắc sửa lệnh</text><text class="fd-sub" x="580.0" y="391" text-anchor="middle">có thể tắt nhắc</text>
<rect class="fd-focal" x="680" y="340" width="120" height="64" rx="6"/><text class="fd-name" x="740.0" y="361" text-anchor="middle">Form sửa lệnh</text><text class="fd-sub" x="740.0" y="377" text-anchor="middle">chỉ sửa giá hoặc KL</text><text class="fd-sub" x="740.0" y="391" text-anchor="middle">trường kia bị khoá</text>
<rect class="fd-node" x="840" y="340" width="120" height="64" rx="6"/><text class="fd-name" x="900.0" y="361" text-anchor="middle">Xác nhận sửa</text><text class="fd-sub" x="900.0" y="377" text-anchor="middle">tóm tắt lệnh</text><text class="fd-sub" x="900.0" y="391" text-anchor="middle">kèm xác thực</text>
<rect class="fd-end" x="840" y="200" width="120" height="56" rx="28"/><text class="fd-name" x="900.0" y="232.5" text-anchor="middle">Hoàn tất</text>
<rect class="fd-node" x="40" y="340" width="120" height="64" rx="6"/><text class="fd-name" x="100.0" y="361" text-anchor="middle">Lịch sử lệnh</text><text class="fd-sub" x="100.0" y="377" text-anchor="middle">lọc mã, trạng thái,</text><text class="fd-sub" x="100.0" y="391" text-anchor="middle">khoảng ngày</text>
<!-- legend / notes -->
<text class="fd-note" x="740" y="446" text-anchor="middle">Quy định sàn KRX: chỉ sửa giá</text><text class="fd-note" x="740" y="462" text-anchor="middle">hoặc khối lượng, không đồng thời.</text>
<line class="fd-rule" x1="40" y1="488" x2="960" y2="488"/>
<text class="fd-eyebrow" x="40" y="508">CHÚ GIẢI</text>
<rect class="fd-end" x="116" y="498" width="24" height="12" rx="6"/>
<text class="fd-sub" x="148" y="508">Kết thúc</text>
<rect class="fd-node" x="220" y="498" width="24" height="12" rx="2"/>
<text class="fd-sub" x="252" y="508">Bước</text>
<rect class="fd-focal" x="302" y="498" width="24" height="12" rx="2"/>
<text class="fd-sub" x="334" y="508">Quyết định thiết kế chính</text>
<polygon class="fd-node" points="502,504 514,497 526,504 514,511"/>
<text class="fd-sub" x="534" y="508">Điều kiện</text>
<path class="fd-arrow" d="M610,504 L634,504" marker-end="url(#bsc-orderbook-ah)"/>
<text class="fd-sub" x="642" y="508">Chuyển bước</text>
</svg>
