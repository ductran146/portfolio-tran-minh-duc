<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 560" role="img" aria-labelledby="bsc-order-title bsc-order-desc" style="display:block;width:100%;min-width:740px;max-width:740px;height:auto;margin-inline:auto">
<title id="bsc-order-title">Luồng đặt lệnh mua/bán</title>
<desc id="bsc-order-desc">Luồng người dùng đặt một lệnh: chọn mã, nhập lệnh, xác nhận, xác thực, rồi nhận kết quả; có hai vòng quay lại khi dữ liệu không hợp lệ hoặc mã xác thực sai.</desc>
<style>
.fd-bg{fill:var(--bg-soft,#f6f7f6)}
.fd-dot{fill:var(--border,#e6e9e6)}
.fd-node{fill:var(--surface,#fff);stroke:var(--ink,#121815);stroke-width:1}
.fd-end{fill:var(--bg-soft,#f6f7f6);stroke:var(--ink-faint,#838d86);stroke-width:1}
.fd-focal{fill:var(--accent-tint,#e6f3ee);stroke:var(--accent,#0b7a5b);stroke-width:1.2}
.fd-name{font:600 13px/1 var(--sans,system-ui,sans-serif);fill:var(--ink,#121815)}
.fd-sub{font:400 11px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-lbl{font:600 10px/1 var(--sans,system-ui,sans-serif);letter-spacing:.08em;fill:var(--ink-secondary,#4b544e)}
.fd-lbl-a{fill:var(--accent,#0b7a5b)}
.fd-note{font:italic 400 12px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-eyebrow{font:600 9px/1 var(--sans,system-ui,sans-serif);letter-spacing:.16em;fill:var(--ink-faint,#838d86)}
.fd-arrow{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
.fd-arrow-a{fill:none;stroke:var(--accent,#0b7a5b);stroke-width:1.5}
.fd-dash{stroke-dasharray:3 3;stroke:var(--ink-faint,#838d86)}
.fd-ah{fill:var(--ink-secondary,#4b544e)}
.fd-ah-a{fill:var(--accent,#0b7a5b)}
.fd-mask{fill:var(--bg-soft,#f6f7f6)}
.fd-rule{stroke:var(--border,#e6e9e6);stroke-width:1}
.fd-dashed{stroke-dasharray:4 3}
.fd-line{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
</style>
<defs>
<pattern id="bsc-order-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" class="fd-dot"/></pattern>
<marker id="bsc-order-ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah" points="0 0, 8 3, 0 6"/></marker>
<marker id="bsc-order-ah-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah-a" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="fd-bg" width="740" height="560"/>
<rect width="740" height="560" fill="url(#bsc-order-dots)" opacity="0.6"/>
<!-- connectors (behind nodes) -->
<path class="fd-arrow" d="M152,156 L188,156" marker-end="url(#bsc-order-ah)"/>
<path class="fd-arrow" d="M324,156 L360,156" marker-end="url(#bsc-order-ah)"/>
<path class="fd-arrow" d="M480,156 L572,156" marker-end="url(#bsc-order-ah)"/>
<path class="fd-arrow" d="M420,108 L420,84 Q420,76 412,76 L264,76 Q256,76 256,84 L256,124" marker-end="url(#bsc-order-ah)"/>
<path class="fd-arrow" d="M632,188 L632,264" marker-end="url(#bsc-order-ah)"/>
<path class="fd-arrow" d="M564,296 L528,296" marker-end="url(#bsc-order-ah)"/>
<path class="fd-arrow" d="M408,296 L348,296" marker-end="url(#bsc-order-ah)"/>
<path class="fd-arrow" d="M468,344 L468,368 Q468,376 476,376 L624,376 Q632,376 632,368 L632,328" marker-end="url(#bsc-order-ah)"/>
<path class="fd-arrow-a" d="M228,296 L176,296" marker-end="url(#bsc-order-ah-a)"/>
<path class="fd-arrow" d="M288,344 L288,396" marker-end="url(#bsc-order-ah)"/>
<!-- arrow labels -->
<rect class="fd-mask" x="506" y="148" width="40" height="16" rx="2"/><text class="fd-lbl" x="526" y="159.5" text-anchor="middle">ĐÚNG</text>
<rect class="fd-mask" x="290" y="68" width="96" height="16" rx="2"/><text class="fd-lbl" x="338" y="79.5" text-anchor="middle">KHÔNG HỢP LỆ</text>
<rect class="fd-mask" x="358" y="288" width="40" height="16" rx="2"/><text class="fd-lbl" x="378" y="299.5" text-anchor="middle">ĐÚNG</text>
<rect class="fd-mask" x="498.5" y="368" width="103" height="16" rx="2"/><text class="fd-lbl" x="550" y="379.5" text-anchor="middle">SAI / HẾT HẠN</text>
<rect class="fd-mask" x="189" y="288" width="26" height="16" rx="2"/><text class="fd-lbl fd-lbl-a" x="202" y="299.5" text-anchor="middle">CÓ</text>
<rect class="fd-mask" x="298" y="362" width="47" height="16" rx="2"/><text class="fd-lbl" x="321.5" y="373.5" text-anchor="middle">KHÔNG</text>
<!-- nodes -->
<rect class="fd-end" x="40" y="128" width="112" height="56" rx="28"/><text class="fd-name" x="96.0" y="153" text-anchor="middle">Chọn mã</text><text class="fd-sub" x="96.0" y="169" text-anchor="middle">mã cổ phiếu</text>
<rect class="fd-node" x="188" y="124" width="136" height="64" rx="6"/><text class="fd-name" x="256.0" y="145" text-anchor="middle">Nhập lệnh</text><text class="fd-sub" x="256.0" y="161" text-anchor="middle">loại lệnh · giá · KL</text><text class="fd-sub" x="256.0" y="175" text-anchor="middle">25 · 50 · 75 · 100%</text>
<polygon class="fd-node" points="420,108 480,156 420,204 360,156"/><text class="fd-name" x="420" y="153.5" text-anchor="middle" style="font-size:12px">Giá, KL</text><text class="fd-name" x="420" y="168.5" text-anchor="middle" style="font-size:12px">hợp lệ?</text>
<rect class="fd-node" x="572" y="124" width="120" height="64" rx="6"/><text class="fd-name" x="632.0" y="145" text-anchor="middle">Xác nhận lệnh</text><text class="fd-sub" x="632.0" y="161" text-anchor="middle">Mua / Bán</text><text class="fd-sub" x="632.0" y="175" text-anchor="middle">chọn cách xác thực</text>
<rect class="fd-node" x="564" y="264" width="136" height="64" rx="6"/><text class="fd-name" x="632.0" y="285" text-anchor="middle">Nhập mã xác thực</text><text class="fd-sub" x="632.0" y="301" text-anchor="middle">OTP · Matrix</text><text class="fd-sub" x="632.0" y="315" text-anchor="middle">Smart OTP · PIN</text>
<polygon class="fd-node" points="468,248 528,296 468,344 408,296"/><text class="fd-name" x="468" y="293.5" text-anchor="middle" style="font-size:12px">Mã xác thực</text><text class="fd-name" x="468" y="308.5" text-anchor="middle" style="font-size:12px">đúng?</text>
<polygon class="fd-node" points="288,248 348,296 288,344 228,296"/><text class="fd-name" x="288" y="293.5" text-anchor="middle" style="font-size:12px">Lệnh được</text><text class="fd-name" x="288" y="308.5" text-anchor="middle" style="font-size:12px">chấp nhận?</text>
<rect class="fd-focal" x="40" y="268" width="136" height="56" rx="28"/><text class="fd-name" x="108.0" y="293" text-anchor="middle">Lệnh thành công</text><text class="fd-sub" x="108.0" y="309" text-anchor="middle">thông báo thành công</text>
<rect class="fd-end" x="208" y="396" width="160" height="56" rx="28"/><text class="fd-name" x="288.0" y="421" text-anchor="middle">Lệnh không thành công</text><text class="fd-sub" x="288.0" y="437" text-anchor="middle">thông báo lỗi</text>
<!-- legend / notes -->
<line class="fd-rule" x1="40" y1="488" x2="700" y2="488"/>
<text class="fd-eyebrow" x="40" y="508">CHÚ GIẢI</text>
<rect class="fd-end" x="116" y="498" width="24" height="12" rx="6"/>
<text class="fd-sub" x="148" y="508">Bắt đầu / kết thúc</text>
<rect class="fd-node" x="276" y="498" width="24" height="12" rx="2"/>
<text class="fd-sub" x="308" y="508">Bước</text>
<polygon class="fd-node" points="358,504 370,497 382,504 370,511"/>
<text class="fd-sub" x="390" y="508">Điều kiện</text>
<path class="fd-arrow-a" d="M466,504 L490,504" marker-end="url(#bsc-order-ah-a)"/>
<text class="fd-sub" x="498" y="508">Luồng thành công</text>
<path class="fd-arrow" d="M618,504 L642,504" marker-end="url(#bsc-order-ah)"/>
<text class="fd-sub" x="650" y="508">Nhánh khác</text>
</svg>
