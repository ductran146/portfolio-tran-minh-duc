<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="tx-login-title tx-login-desc" style="display:block;width:100%;min-width:940px;max-width:940px;height:auto;margin-inline:auto">
<title id="tx-login-title">Luồng đăng nhập và khôi phục mật khẩu</title>
<desc id="tx-login-desc">Người dùng đăng nhập bằng tài khoản và mật khẩu hoặc sinh trắc học; đăng nhập sai thì báo lỗi và nhập lại, quên mật khẩu thì xác thực OTP rồi nhận mật khẩu mới qua email.</desc>
<style>
.fd-bg{fill:var(--bg-soft,#f6f7f6)}
.fd-dot{fill:var(--border,#e6e9e6)}
.fd-node{fill:var(--surface,#fff);stroke:var(--ink,#121815);stroke-width:1}
.fd-end{fill:var(--bg-soft,#f6f7f6);stroke:var(--ink-faint,#838d86);stroke-width:1}
.fd-focal{fill:var(--accent-tint,#e6f3ee);stroke:var(--accent,#0b7a5b);stroke-width:1.2}
.fd-name{font:600 13px/1 var(--sans,system-ui,sans-serif);fill:var(--ink,#121815)}
.fd-sub{font:400 11px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-lbl{font:600 10px/1 var(--sans,system-ui,sans-serif);letter-spacing:.08em;fill:var(--ink-secondary,#4b544e)}
.fd-lbl-a{fill:var(--accent,#0b7a5b)}
.fd-note{font:italic 400 12px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-eyebrow{font:600 9px/1 var(--sans,system-ui,sans-serif);letter-spacing:.16em;fill:var(--ink-faint,#838d86)}
.fd-arrow{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
.fd-arrow-a{fill:none;stroke:var(--accent,#0b7a5b);stroke-width:1.5}
.fd-dash{stroke-dasharray:3 3;stroke:var(--ink-faint,#838d86)}
.fd-ah{fill:var(--ink-secondary,#4b544e)}
.fd-ah-a{fill:var(--accent,#0b7a5b)}
.fd-mask{fill:var(--bg-soft,#f6f7f6)}
.fd-rule{stroke:var(--border,#e6e9e6);stroke-width:1}
.fd-dashed{stroke-dasharray:4 3}
.fd-line{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
</style>
<defs>
<pattern id="tx-login-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" class="fd-dot"/></pattern>
<marker id="tx-login-ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah" points="0 0, 8 3, 0 6"/></marker>
<marker id="tx-login-ah-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah-a" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="fd-bg" width="940" height="520"/>
<rect width="940" height="520" fill="url(#tx-login-dots)" opacity="0.6"/>
<!-- connectors (behind nodes) -->
<path class="fd-arrow" d="M188,156 L232,156" marker-end="url(#tx-login-ah)"/>
<path class="fd-arrow" d="M352,156 L412,156" marker-end="url(#tx-login-ah)"/>
<path class="fd-arrow" d="M292,108 L292,84 Q292,76 284,76 L122,76 Q114,76 114,84 L114,124" marker-end="url(#tx-login-ah)"/>
<path class="fd-arrow" d="M114,188 L114,264" marker-end="url(#tx-login-ah)"/>
<path class="fd-arrow" d="M188,296 L232,296" marker-end="url(#tx-login-ah)"/>
<path class="fd-arrow" d="M380,296 L424,296" marker-end="url(#tx-login-ah)"/>
<path class="fd-arrow" d="M544,296 L604,296" marker-end="url(#tx-login-ah)"/>
<path class="fd-arrow" d="M484,344 L484,368 Q484,376 476,376 L314,376 Q306,376 306,368 L306,328" marker-end="url(#tx-login-ah)"/>
<path class="fd-arrow" d="M752,296 L792,296" marker-end="url(#tx-login-ah)"/>
<!-- arrow labels -->
<rect class="fd-mask" x="362" y="148" width="40" height="16" rx="2"/><text class="fd-lbl fd-lbl-a" x="382" y="159.5" text-anchor="middle">ĐÚNG</text>
<rect class="fd-mask" x="155" y="68" width="96" height="16" rx="2"/><text class="fd-lbl" x="203" y="79.5" text-anchor="middle">SAI MẬT KHẨU</text>
<rect class="fd-mask" x="124" y="218" width="103" height="16" rx="2"/><text class="fd-lbl" x="175.5" y="229.5" text-anchor="middle">QUÊN MẬT KHẨU</text>
<rect class="fd-mask" x="554" y="288" width="40" height="16" rx="2"/><text class="fd-lbl" x="574" y="299.5" text-anchor="middle">ĐÚNG</text>
<rect class="fd-mask" x="333" y="368" width="124" height="16" rx="2"/><text class="fd-lbl" x="395" y="379.5" text-anchor="middle">SAI HOẶC HẾT HẠN</text>
<!-- nodes -->
<rect class="fd-node" x="40" y="124" width="148" height="64" rx="6"/><text class="fd-name" x="114.0" y="145" text-anchor="middle">Đăng nhập</text><text class="fd-sub" x="114.0" y="161" text-anchor="middle">tài khoản · mật khẩu</text><text class="fd-sub" x="114.0" y="175" text-anchor="middle">hoặc sinh trắc học</text>
<polygon class="fd-node" points="292,108 352,156 292,204 232,156"/><text class="fd-name" x="292" y="153.5" text-anchor="middle" style="font-size:12px">Thông tin</text><text class="fd-name" x="292" y="168.5" text-anchor="middle" style="font-size:12px">đúng?</text>
<rect class="fd-focal" x="412" y="124" width="148" height="64" rx="32"/><text class="fd-name" x="486.0" y="160.5" text-anchor="middle">Vào ứng dụng</text>
<rect class="fd-node" x="40" y="264" width="148" height="64" rx="6"/><text class="fd-name" x="114.0" y="285" text-anchor="middle">Quên mật khẩu</text><text class="fd-sub" x="114.0" y="301" text-anchor="middle">tài khoản · CCCD</text><text class="fd-sub" x="114.0" y="315" text-anchor="middle">email · số điện thoại</text>
<rect class="fd-node" x="232" y="264" width="148" height="64" rx="6"/><text class="fd-name" x="306.0" y="285" text-anchor="middle">Nhập OTP</text><text class="fd-sub" x="306.0" y="301" text-anchor="middle">đếm ngược</text><text class="fd-sub" x="306.0" y="315" text-anchor="middle">gửi lại khi hết hạn</text>
<polygon class="fd-node" points="484,248 544,296 484,344 424,296"/><text class="fd-name" x="484" y="293.5" text-anchor="middle" style="font-size:12px">OTP</text><text class="fd-name" x="484" y="308.5" text-anchor="middle" style="font-size:12px">đúng?</text>
<rect class="fd-node" x="604" y="264" width="148" height="64" rx="6"/><text class="fd-name" x="678.0" y="285" text-anchor="middle">Mật khẩu mới</text><text class="fd-sub" x="678.0" y="301" text-anchor="middle">gửi qua email</text><text class="fd-sub" x="678.0" y="315" text-anchor="middle">nên đổi sau khi vào</text>
<rect class="fd-end" x="792" y="268" width="112" height="56" rx="28"/><text class="fd-name" x="848.0" y="300.5" text-anchor="middle">Về đăng nhập</text>
<!-- legend / notes -->
<text class="fd-note" x="40" y="440" text-anchor="start">Gửi lại OTP lỗi: hiện toast. OTP sai: ô nhập được focus lại để nhập tiếp.</text>
<line class="fd-rule" x1="40" y1="480" x2="900" y2="480"/>
<text class="fd-eyebrow" x="40" y="500">CHÚ GIẢI</text>
<rect class="fd-end" x="116" y="490" width="24" height="12" rx="6"/>
<text class="fd-sub" x="148" y="500">Bắt đầu / kết thúc</text>
<rect class="fd-node" x="276" y="490" width="24" height="12" rx="2"/>
<text class="fd-sub" x="308" y="500">Bước</text>
<polygon class="fd-node" points="358,496 370,489 382,496 370,503"/>
<text class="fd-sub" x="390" y="500">Điều kiện</text>
<path class="fd-arrow" d="M466,496 L490,496" marker-end="url(#tx-login-ah)"/>
<text class="fd-sub" x="498" y="500">Chuyển bước</text>
</svg>
