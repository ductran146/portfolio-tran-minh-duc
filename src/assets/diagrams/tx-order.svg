<polygon class="fd-node" points="256,108 316,156 256,204 196,156"/><text class="fd-name" x="256" y="153.5" text-anchor="middle" style="font-size:12px">Đã</text><text class="fd-name" x="256" y="168.5" text-anchor="middle" style="font-size:12px">đăng nhập?</text>
<rect class="fd-node" x="372" y="124" width="148" height="64" rx="6"/><text class="fd-name" x="446.0" y="145" text-anchor="middle">Form đặt lệnh</text><text class="fd-sub" x="446.0" y="161" text-anchor="middle">loại lệnh · giá · KL</text><text class="fd-sub" x="446.0" y="175" text-anchor="middle">xem độ sâu thị trường</text>
<polygon class="fd-node" points="636,108 696,156 636,204 576,156"/><text class="fd-name" x="636" y="153.5" text-anchor="middle" style="font-size:12px">Lệnh</text><text class="fd-name" x="636" y="168.5" text-anchor="middle" style="font-size:12px">hợp lệ?</text>
<rect class="fd-node" x="752" y="124" width="148" height="64" rx="6"/><text class="fd-name" x="826.0" y="145" text-anchor="middle">Xác nhận lệnh</text><text class="fd-sub" x="826.0" y="161" text-anchor="middle">Buy order confirm</text><text class="fd-sub" x="826.0" y="175" text-anchor="middle">Cancel · Confirm</text>
<polygon class="fd-node" points="826,248 886,296 826,344 766,296"/><text class="fd-name" x="826" y="293.5" text-anchor="middle" style="font-size:12px">Lệnh được</text><text class="fd-name" x="826" y="308.5" text-anchor="middle" style="font-size:12px">gửi?</text>
