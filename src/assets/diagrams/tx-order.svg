<rect class="fd-end" x="746" y="392" width="160" height="56" rx="28"/><text class="fd-name" x="826.0" y="417" text-anchor="middle">Lệnh chưa thực hiện</text><text class="fd-sub" x="826.0" y="433" text-anchor="middle">thông báo lỗi</text>
<rect class="fd-end" x="176" y="268" width="160" height="56" rx="28"/><text class="fd-name" x="256.0" y="293" text-anchor="middle">Yêu cầu đăng nhập</text><text class="fd-sub" x="256.0" y="309" text-anchor="middle">Login · Maybe later</text>
<!-- legend / notes -->
<text class="fd-note" x="372" y="380" text-anchor="start">Loại lệnh chỉ dùng trong phiên (ví dụ ATO):</text><text class="fd-note" x="372" y="396" text-anchor="start">ngoài phiên, sheet chọn loại lệnh báo không khả dụng.</text>
