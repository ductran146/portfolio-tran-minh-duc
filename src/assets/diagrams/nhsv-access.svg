<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="nhsv-access-title nhsv-access-desc" style="display:block;width:100%;min-width:900px;max-width:900px;height:auto;margin-inline:auto">
<title id="nhsv-access-title">Luồng đăng ký, đăng nhập và vào ứng dụng NHSV</title>
<desc id="nhsv-access-desc">Người dùng chưa đăng nhập vào Đăng ký, từ đó đi tới xác thực OTP và sinh trắc học, mở tài khoản mới bằng eKYC, vào Trang chủ, xem onboarding hoặc đăng nhập.</desc>
<style>
.fd-bg{fill:var(--bg-soft,#f6f7f6)}
.fd-dot{fill:var(--border,#e6e9e6)}
.fd-node{fill:var(--surface,#fff);stroke:var(--ink,#121815);stroke-width:1}
.fd-end{fill:var(--bg-soft,#f6f7f6);stroke:var(--ink-faint,#838d86);stroke-width:1}
.fd-focal{fill:var(--accent-tint,#e6f3ee);stroke:var(--accent,#0b7a5b);stroke-width:1.2}
.fd-name{font:600 13px/1 var(--sans,system-ui,sans-serif);fill:var(--ink,#121815)}
.fd-sub{font:400 11px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-lbl{font:600 10px/1 var(--sans,system-ui,sans-serif);letter-spacing:.08em;fill:var(--ink-secondary,#4b544e)}
.fd-lbl-a{fill:var(--accent,#0b7a5b)}
.fd-note{font:italic 400 12px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-eyebrow{font:600 9px/1 var(--sans,system-ui,sans-serif);letter-spacing:.16em;fill:var(--ink-faint,#838d86)}
.fd-arrow{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
.fd-arrow-a{fill:none;stroke:var(--accent,#0b7a5b);stroke-width:1.5}
.fd-dash{stroke-dasharray:3 3;stroke:var(--ink-faint,#838d86)}
.fd-ah{fill:var(--ink-secondary,#4b544e)}
.fd-ah-a{fill:var(--accent,#0b7a5b)}
.fd-mask{fill:var(--bg-soft,#f6f7f6)}
.fd-rule{stroke:var(--border,#e6e9e6);stroke-width:1}
.fd-dashed{stroke-dasharray:4 3}
.fd-line{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
</style>
<defs>
<pattern id="nhsv-access-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" class="fd-dot"/></pattern>
<marker id="nhsv-access-ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah" points="0 0, 8 3, 0 6"/></marker>
<marker id="nhsv-access-ah-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah-a" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="fd-bg" width="900" height="520"/>
<rect width="900" height="520" fill="url(#nhsv-access-dots)" opacity="0.6"/>
<!-- connectors (behind nodes) -->
<path class="fd-arrow" d="M176,232 L232,232" marker-end="url(#nhsv-access-ah)"/>
<path class="fd-arrow" d="M352,80 L408,80" marker-end="url(#nhsv-access-ah)"/>
<path class="fd-arrow" d="M352,156 L408,156" marker-end="url(#nhsv-access-ah)"/>
<path class="fd-arrow" d="M352,232 L408,232" marker-end="url(#nhsv-access-ah)"/>
<path class="fd-arrow" d="M352,308 L408,308" marker-end="url(#nhsv-access-ah)"/>
<path class="fd-arrow" d="M352,384 L408,384" marker-end="url(#nhsv-access-ah)"/>
<!-- arrow labels -->

<!-- nodes -->
<rect class="fd-end" x="40" y="204" width="136" height="56" rx="28"/><text class="fd-name" x="108.0" y="236.5" text-anchor="middle">Không đăng nhập</text>
<rect class="fd-node" x="232" y="52" width="120" height="360" rx="6"/><text class="fd-name" x="292.0" y="221" text-anchor="middle">Đăng ký</text><text class="fd-sub" x="292.0" y="237" text-anchor="middle">điểm vào của</text><text class="fd-sub" x="292.0" y="251" text-anchor="middle">người dùng mới</text>
<rect class="fd-node" x="408" y="52" width="240" height="56" rx="6"/><text class="fd-name" x="528.0" y="84.5" text-anchor="middle">OTP &amp; Sinh trắc học</text>
<rect class="fd-node" x="408" y="128" width="240" height="56" rx="6"/><text class="fd-name" x="528.0" y="153" text-anchor="middle">eKYC</text><text class="fd-sub" x="528.0" y="169" text-anchor="middle">tài khoản mới</text>
<rect class="fd-focal" x="408" y="204" width="240" height="56" rx="6"/><text class="fd-name" x="528.0" y="229" text-anchor="middle">Trang chủ</text><text class="fd-sub" x="528.0" y="245" text-anchor="middle">8 khu vực chính</text>
<rect class="fd-node" x="408" y="280" width="240" height="56" rx="6"/><text class="fd-name" x="528.0" y="312.5" text-anchor="middle">Onboarding</text>
<rect class="fd-node" x="408" y="356" width="240" height="56" rx="6"/><text class="fd-name" x="528.0" y="388.5" text-anchor="middle">Đăng nhập</text>
<!-- legend / notes -->
<text class="fd-note" x="700" y="150" text-anchor="start">Trang chủ mở ra tám khu vực</text><text class="fd-note" x="700" y="166" text-anchor="start">chính, xem sơ đồ kế tiếp.</text>
<line class="fd-rule" x1="40" y1="470" x2="860" y2="470"/>
<text class="fd-eyebrow" x="40" y="490">CHÚ GIẢI</text>
<rect class="fd-end" x="116" y="480" width="24" height="12" rx="6"/>
<text class="fd-sub" x="148" y="490">Bắt đầu</text>
<rect class="fd-node" x="218" y="480" width="24" height="12" rx="2"/>
<text class="fd-sub" x="250" y="490">Màn hình</text>
<rect class="fd-focal" x="326" y="480" width="24" height="12" rx="2"/>
<text class="fd-sub" x="358" y="490">Điểm vào ứng dụng</text>
<path class="fd-arrow" d="M488,486 L512,486" marker-end="url(#nhsv-access-ah)"/>
<text class="fd-sub" x="520" y="490">Chuyển màn</text>
</svg>
