<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-labelledby="tn-purchase-title tn-purchase-desc" style="display:block;width:100%;min-width:980px;max-width:980px;height:auto;margin-inline:auto">
<title id="tn-purchase-title">Luồng nhập hàng (phiếu nhập)</title>
<desc id="tn-purchase-desc">Người dùng lập phiếu nhập, lưu nháp rồi ghi sổ qua hộp xác nhận; ghi sổ mới tăng tồn kho, cập nhật giá nhập và tạo phiếu chi nếu có trả trước.</desc>
<style>
.fd-bg{fill:var(--bg-soft,#f6f7f6)}
.fd-dot{fill:var(--border,#e6e9e6)}
.fd-node{fill:var(--surface,#fff);stroke:var(--ink,#121815);stroke-width:1}
.fd-end{fill:var(--bg-soft,#f6f7f6);stroke:var(--ink-faint,#838d86);stroke-width:1}
.fd-focal{fill:var(--accent-tint,#e6f3ee);stroke:var(--accent,#0b7a5b);stroke-width:1.2}
.fd-name{font:600 13px/1 var(--sans,system-ui,sans-serif);fill:var(--ink,#121815)}
.fd-sub{font:400 11px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-lbl{font:600 10px/1 var(--sans,system-ui,sans-serif);letter-spacing:.08em;fill:var(--ink-secondary,#4b544e)}
.fd-lbl-a{fill:var(--accent,#0b7a5b)}
.fd-note{font:italic 400 12px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-eyebrow{font:600 9px/1 var(--sans,system-ui,sans-serif);letter-spacing:.16em;fill:var(--ink-faint,#838d86)}
.fd-arrow{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
.fd-arrow-a{fill:none;stroke:var(--accent,#0b7a5b);stroke-width:1.5}
.fd-dash{stroke-dasharray:3 3;stroke:var(--ink-faint,#838d86)}
.fd-ah{fill:var(--ink-secondary,#4b544e)}
.fd-ah-a{fill:var(--accent,#0b7a5b)}
.fd-mask{fill:var(--bg-soft,#f6f7f6)}
.fd-rule{stroke:var(--border,#e6e9e6);stroke-width:1}
.fd-dashed{stroke-dasharray:4 3}
.fd-line{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
</style>
<defs>
<pattern id="tn-purchase-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" class="fd-dot"/></pattern>
<marker id="tn-purchase-ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah" points="0 0, 8 3, 0 6"/></marker>
<marker id="tn-purchase-ah-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah-a" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="fd-bg" width="980" height="480"/>
<rect width="980" height="480" fill="url(#tn-purchase-dots)" opacity="0.6"/>
<!-- connectors (behind nodes) -->
<path class="fd-arrow" d="M188,156 L232,156" marker-end="url(#tn-purchase-ah)"/>
<path class="fd-arrow" d="M380,156 L424,156" marker-end="url(#tn-purchase-ah)"/>
<path class="fd-arrow" d="M544,156 L604,156" marker-end="url(#tn-purchase-ah)"/>
<path class="fd-arrow" d="M484,108 L484,84 Q484,76 476,76 L314,76 Q306,76 306,84 L306,124" marker-end="url(#tn-purchase-ah)"/>
<path class="fd-arrow" d="M752,156 L816,156" marker-end="url(#tn-purchase-ah)"/>
<path class="fd-arrow" d="M678,188 L678,264" marker-end="url(#tn-purchase-ah)"/>
<path class="fd-arrow" d="M604,296 L528,296" marker-end="url(#tn-purchase-ah)"/>
<!-- arrow labels -->
<rect class="fd-mask" x="554" y="148" width="40" height="16" rx="2"/><text class="fd-lbl" x="574" y="159.5" text-anchor="middle">ĐÚNG</text>
<rect class="fd-mask" x="364.5" y="68" width="61" height="16" rx="2"/><text class="fd-lbl" x="395" y="79.5" text-anchor="middle">BÁO LỖI</text>
<rect class="fd-mask" x="767.5" y="148" width="33" height="16" rx="2"/><text class="fd-lbl" x="784" y="159.5" text-anchor="middle">HUỶ</text>
<rect class="fd-mask" x="688" y="218" width="54" height="16" rx="2"/><text class="fd-lbl" x="715" y="229.5" text-anchor="middle">GHI SỔ</text>
<rect class="fd-mask" x="539" y="288" width="54" height="16" rx="2"/><text class="fd-lbl" x="566" y="299.5" text-anchor="middle">ĐỒNG Ý</text>
<!-- nodes -->
<rect class="fd-end" x="40" y="128" width="148" height="56" rx="28"/><text class="fd-name" x="114.0" y="153" text-anchor="middle">Tạo phiếu</text><text class="fd-sub" x="114.0" y="169" text-anchor="middle">Giao dịch → Phiếu nhập</text>
<rect class="fd-node" x="232" y="124" width="148" height="64" rx="6"/><text class="fd-name" x="306.0" y="145" text-anchor="middle">Điền phiếu</text><text class="fd-sub" x="306.0" y="161" text-anchor="middle">NCC · ngày · dòng hàng</text><text class="fd-sub" x="306.0" y="175" text-anchor="middle">trả trước, ghi chú</text>
<polygon class="fd-node" points="484,108 544,156 484,204 424,156"/><text class="fd-name" x="484" y="153.5" text-anchor="middle" style="font-size:12px">Form</text><text class="fd-name" x="484" y="168.5" text-anchor="middle" style="font-size:12px">hợp lệ?</text>
<rect class="fd-node" x="604" y="124" width="148" height="64" rx="6"/><text class="fd-name" x="678.0" y="145" text-anchor="middle">Nháp</text><text class="fd-sub" x="678.0" y="161" text-anchor="middle">sửa phiếu · huỷ nháp</text><text class="fd-sub" x="678.0" y="175" text-anchor="middle">được phép</text>
<rect class="fd-end" x="816" y="128" width="124" height="56" rx="28"/><text class="fd-name" x="878.0" y="160.5" text-anchor="middle">Đã hủy</text>
<rect class="fd-node" x="604" y="264" width="148" height="64" rx="6"/><text class="fd-name" x="678.0" y="285" text-anchor="middle">Xác nhận ghi sổ</text><text class="fd-sub" x="678.0" y="301" text-anchor="middle">nhắc: cập nhật tồn,</text><text class="fd-sub" x="678.0" y="315" text-anchor="middle">không sửa trực tiếp</text>
<rect class="fd-focal" x="328" y="264" width="200" height="64" rx="6"/><text class="fd-name" x="428.0" y="285" text-anchor="middle">Đã ghi sổ</text><text class="fd-sub" x="428.0" y="301" text-anchor="middle">tăng tồn · cập nhật giá nhập</text><text class="fd-sub" x="428.0" y="315" text-anchor="middle">phiếu chi nếu có trả trước</text>
<!-- legend / notes -->
<text class="fd-note" x="40" y="372" text-anchor="start">Không có Hủy ghi sổ cho phiếu nhập:</text><text class="fd-note" x="40" y="388" text-anchor="start">muốn đảo, tạo Phiếu trả hàng nhập.</text>
<line class="fd-rule" x1="40" y1="430" x2="940" y2="430"/>
<text class="fd-eyebrow" x="40" y="450">CHÚ GIẢI</text>
<rect class="fd-end" x="116" y="440" width="24" height="12" rx="6"/>
<text class="fd-sub" x="148" y="450">Bắt đầu / kết thúc</text>
<rect class="fd-node" x="276" y="440" width="24" height="12" rx="2"/>
<text class="fd-sub" x="308" y="450">Bước</text>
<rect class="fd-focal" x="358" y="440" width="24" height="12" rx="2"/>
<text class="fd-sub" x="390" y="450">Bước tác động tồn kho</text>
<polygon class="fd-node" points="530,446 542,439 554,446 542,453"/>
<text class="fd-sub" x="562" y="450">Điều kiện</text>
<path class="fd-arrow" d="M638,446 L662,446" marker-end="url(#tn-purchase-ah)"/>
<text class="fd-sub" x="670" y="450">Chuyển bước</text>
</svg>
