<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="tx-watchlist-title tx-watchlist-desc" style="display:block;width:100%;min-width:1040px;max-width:1040px;height:auto;margin-inline:auto">
<title id="tx-watchlist-title">Luồng quản lý watchlist</title>
<desc id="tx-watchlist-desc">Từ màn Watchlist trong Market, người dùng thêm mã qua tìm kiếm, chọn danh sách để thêm, tạo hoặc đổi tên danh sách, hoặc xoá danh sách có cảnh báo; mỗi thao tác kết thúc bằng một thông báo riêng.</desc>
<style>
.fd-bg{fill:var(--bg-soft,#f6f7f6)}
.fd-dot{fill:var(--border,#e6e9e6)}
.fd-node{fill:var(--surface,#fff);stroke:var(--ink,#121815);stroke-width:1}
.fd-end{fill:var(--bg-soft,#f6f7f6);stroke:var(--ink-faint,#838d86);stroke-width:1}
.fd-focal{fill:var(--accent-tint,#e6f3ee);stroke:var(--accent,#0b7a5b);stroke-width:1.2}
.fd-name{font:600 13px/1 var(--sans,system-ui,sans-serif);fill:var(--ink,#121815)}
.fd-sub{font:400 11px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-lbl{font:600 10px/1 var(--sans,system-ui,sans-serif);letter-spacing:.08em;fill:var(--ink-secondary,#4b544e)}
.fd-lbl-a{fill:var(--accent,#0b7a5b)}
.fd-note{font:italic 400 12px/1 var(--sans,system-ui,sans-serif);fill:var(--ink-secondary,#4b544e)}
.fd-eyebrow{font:600 9px/1 var(--sans,system-ui,sans-serif);letter-spacing:.16em;fill:var(--ink-faint,#838d86)}
.fd-arrow{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
.fd-arrow-a{fill:none;stroke:var(--accent,#0b7a5b);stroke-width:1.5}
.fd-dash{stroke-dasharray:3 3;stroke:var(--ink-faint,#838d86)}
.fd-ah{fill:var(--ink-secondary,#4b544e)}
.fd-ah-a{fill:var(--accent,#0b7a5b)}
.fd-mask{fill:var(--bg-soft,#f6f7f6)}
.fd-rule{stroke:var(--border,#e6e9e6);stroke-width:1}
.fd-dashed{stroke-dasharray:4 3}
.fd-line{fill:none;stroke:var(--ink-secondary,#4b544e);stroke-width:1.2}
</style>
<defs>
<pattern id="tx-watchlist-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" class="fd-dot"/></pattern>
<marker id="tx-watchlist-ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah" points="0 0, 8 3, 0 6"/></marker>
<marker id="tx-watchlist-ah-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="fd-ah-a" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="fd-bg" width="1040" height="480"/>
<rect width="1040" height="480" fill="url(#tx-watchlist-dots)" opacity="0.6"/>
<!-- connectors (behind nodes) -->
<path class="fd-arrow" d="M160,96 L216,96" marker-end="url(#tx-watchlist-ah)"/>
<path class="fd-arrow" d="M160,208 L216,208" marker-end="url(#tx-watchlist-ah)"/>
<path class="fd-arrow" d="M356,96 L420,96" marker-end="url(#tx-watchlist-ah)"/>
<path class="fd-arrow" d="M356,208 L420,208" marker-end="url(#tx-watchlist-ah)"/>
<path class="fd-arrow" d="M286,240 L286,312 Q286,320 294,320 L420,320" marker-end="url(#tx-watchlist-ah)"/>
<path class="fd-arrow" d="M560,96 L686,96 Q694,96 694,104 L694,180" marker-end="url(#tx-watchlist-ah)"/>
<path class="fd-arrow" d="M560,208 L624,208" marker-end="url(#tx-watchlist-ah)"/>
<path class="fd-arrow" d="M560,320 L686,320 Q694,320 694,312 L694,236" marker-end="url(#tx-watchlist-ah)"/>
<!-- arrow labels -->
<rect class="fd-mask" x="371.5" y="200" width="33" height="16" rx="2"/><text class="fd-lbl" x="388" y="211.5" text-anchor="middle">SỬA</text>
<rect class="fd-mask" x="336.5" y="312" width="33" height="16" rx="2"/><text class="fd-lbl" x="353" y="323.5" text-anchor="middle">XOÁ</text>
<!-- nodes -->
<rect class="fd-node" x="40" y="64" width="120" height="336" rx="6"/><text class="fd-name" x="100.0" y="221" text-anchor="middle">Watchlist</text><text class="fd-sub" x="100.0" y="237" text-anchor="middle">trong Market</text><text class="fd-sub" x="100.0" y="251" text-anchor="middle">rỗng: Add symbol</text>
<rect class="fd-node" x="216" y="64" width="140" height="64" rx="6"/><text class="fd-name" x="286.0" y="85" text-anchor="middle">Tìm mã</text><text class="fd-sub" x="286.0" y="101" text-anchor="middle">dùng chung màn</text><text class="fd-sub" x="286.0" y="115" text-anchor="middle">tìm kiếm</text>
<rect class="fd-node" x="420" y="64" width="140" height="64" rx="6"/><text class="fd-name" x="490.0" y="85" text-anchor="middle">Chọn danh sách</text><text class="fd-sub" x="490.0" y="101" text-anchor="middle">sheet kèm số mã</text><text class="fd-sub" x="490.0" y="115" text-anchor="middle">mỗi danh sách</text>
<rect class="fd-node" x="216" y="176" width="140" height="64" rx="6"/><text class="fd-name" x="286.0" y="205" text-anchor="middle">Danh sách của tôi</text><text class="fd-sub" x="286.0" y="221" text-anchor="middle">sheet Watchlists</text>
<rect class="fd-node" x="420" y="176" width="140" height="64" rx="6"/><text class="fd-name" x="490.0" y="197" text-anchor="middle">Tạo / đổi tên</text><text class="fd-sub" x="490.0" y="213" text-anchor="middle">nhập tên</text><text class="fd-sub" x="490.0" y="227" text-anchor="middle">Confirm</text>
<rect class="fd-focal" x="420" y="288" width="140" height="64" rx="6"/><text class="fd-name" x="490.0" y="309" text-anchor="middle">Xoá danh sách</text><text class="fd-sub" x="490.0" y="325" text-anchor="middle">cảnh báo mã bị gỡ</text><text class="fd-sub" x="490.0" y="339" text-anchor="middle">không hoàn tác</text>
<rect class="fd-end" x="624" y="180" width="140" height="56" rx="28"/><text class="fd-name" x="694.0" y="205" text-anchor="middle">Toast phản hồi</text><text class="fd-sub" x="694.0" y="221" text-anchor="middle">riêng cho từng thao tác</text>
<!-- legend / notes -->
<text class="fd-note" x="800" y="100" text-anchor="start">Thêm mã không có</text><text class="fd-note" x="800" y="116" text-anchor="start">màn riêng: dùng lại</text><text class="fd-note" x="800" y="132" text-anchor="start">màn tìm kiếm chung.</text>
<text class="fd-note" x="800" y="296" text-anchor="start">Xoá cần xác nhận;</text><text class="fd-note" x="800" y="312" text-anchor="start">tạo, đổi tên, xoá</text><text class="fd-note" x="800" y="328" text-anchor="start">đều có toast riêng.</text>
<line class="fd-rule" x1="40" y1="430" x2="1000" y2="430"/>
<text class="fd-eyebrow" x="40" y="450">CHÚ GIẢI</text>
<rect class="fd-node" x="116" y="440" width="24" height="12" rx="2"/>
<text class="fd-sub" x="148" y="450">Màn hình / bước</text>
<rect class="fd-focal" x="258" y="440" width="24" height="12" rx="2"/>
<text class="fd-sub" x="290" y="450">Thao tác nguy hiểm</text>
<rect class="fd-end" x="420" y="440" width="24" height="12" rx="6"/>
<text class="fd-sub" x="452" y="450">Phản hồi</text>
<path class="fd-arrow" d="M526,446 L550,446" marker-end="url(#tx-watchlist-ah)"/>
<text class="fd-sub" x="558" y="450">Chuyển bước</text>
</svg>
