# Build Astro và phát thư mục dist/ lên GitHub Pages mỗi khi push lên main.
# Yêu cầu: repo Public (Pages miễn phí chỉ cho repo public), Settings → Pages →
# Source = "GitHub Actions". Repo tên `ductran146.github.io` thì site ở gốc
# https://ductran146.github.io/ (mọi link tuyệt đối /... trong code giữ nguyên).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        env:
          # Không đưa giao diện quản trị Keystatic (local, không đăng nhập) lên site.
          SKIP_KEYSTATIC: "1"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
