# Build Astro và phát thư mục dist/ lên GitHub Pages mỗi khi push lên main.
# Yêu cầu: repo Public, Settings → Pages → Source = "GitHub Actions" (KHÔNG chọn
# "Deploy from a branch": Pages sẽ chạy Jekyll trên mã nguồn Astro và báo lỗi).
# Repo tên `ductran146.github.io` thì site ở gốc https://ductran146.github.io/
# (mọi link tuyệt đối /... trong code giữ nguyên, không cần `base`).
#
# Các bước viết tường minh (thay withastro/action, 2026-09-20 — bản đó không
# truyền SKIP_KEYSTATIC vào build → lỗi NoAdapterInstalled) để log rõ ràng.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Build Astro
        # Không đưa giao diện quản trị Keystatic (local, không đăng nhập) lên site.
        # astro.config.mjs cũng tự bỏ Keystatic khi CI=true (GitHub Actions đặt sẵn).
        env:
          SKIP_KEYSTATIC: "1"
        run: npm run build

      - name: Đóng gói dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
